<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Initialisation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>Initialisation de la simulation</h2>

  <p id="loadingText">
    Installation du plateau de jeu en cours...
  </p>

  <!-- Barre de progression + message intégré -->
  <div class="progress-container">
    <div id="progressBar"></div>
    <div id="errorOverlay"></div>
  </div>

  <p id="progressText">0%</p>

</div>

<script>

let messages = [
  "Connexion au serveur EVJF...",
  "Analyse du profil joueur...",
  "Génération des missions...",
  "Chargement des coéquipières...",
  "Finalisation..."
];

let progress = 0;
let index = 0;

let interval = setInterval(() => {

  // progression
  progress += 5;

  document.getElementById("progressBar").style.width = progress + "%";
  document.getElementById("progressText").innerText = progress + "%";

  // messages
  if (progress % 20 === 0 && index < messages.length) {
    document.getElementById("loadingText").innerText = messages[index];
    index++;
  }

  // fin
  if (progress >= 100) {
    clearInterval(interval);

    document.getElementById("loadingText").style.display = "none";

    const overlay = document.getElementById("errorOverlay");
    overlay.style.display = "flex";
    overlay.innerText = "❌ ERREUR ! Date non identifiée ! Merci de réessayer ultérieurement";
  }

}, 300);

  
  <button id="funButton" style="display:none;">
  Afin de patienter, nous vous proposons un divertissement
</button>

<div id="videoContainer"></div>
  

</script>

</body>
</html>

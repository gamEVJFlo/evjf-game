<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Initialisation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h2>Initialisation de la simulation</h2>

  <p id="loadingText">
    Installation du plateau de jeu en cours...
  </p>

  <!-- Barre de progression -->
  <div class="progress-container">
    <div id="progressBar"></div>
  </div>

  <p id="progressText">0%</p>

  <!-- Message erreur caché -->
  <p id="errorMessage" style="display:none;">
    ❌ ERREUR ! Date non identifiée ! Merci de réessayer ultérieurement
  </p>
</div>

<script>

let messages = [
  "Connexion au serveur EVJF...",
  "Analyse du profil joueur...",
  "Génération des missions...",
  "Chargement des coéquipières...",
  "Finalisation..."
];

let progress = 0;
let index = 0;

let interval = setInterval(() => {

  // Mise à jour du pourcentage
  progress += 5;
  document.getElementById("progressBar").style.width = progress + "%";
  document.getElementById("progressText").innerText = progress + "%";

  // Changement des messages
  if (progress % 20 === 0 && index < messages.length) {
    document.getElementById("loadingText").innerText = messages[index];
    index++;
  }

  // Quand on atteint 100%
  if (progress >= 100) {
    clearInterval(interval);

    document.getElementById("loadingText").style.display = "none";
    document.getElementById("errorMessage").style.display = "block";
  }

}, 150);

</script>

</body>
</html>

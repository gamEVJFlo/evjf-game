<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Initialisation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Bouton menu -->
<a href="index.html" class="menu-button">
  ⬅ Menu principal
</a>

<div class="container">

  <h2>Initialisation de la simulation</h2>

  <p id="loadingText">
    Installation du plateau de jeu en cours...
  </p>

  <!-- Barre -->
  <div class="progress-container">
    <div id="progressBar"></div>
    <div id="errorOverlay"></div>
  </div>

  <p id="progressText">0%</p>

  <!-- Bouton divertissement -->
  <button id="funButton" style="display:none;">
    Afin de patienter,<br>
    nous vous proposons un divertissement
  </button>

  <!-- Vidéo -->
  <div id="videoContainer"></div>

</div>

<script>

let messages = [
  "Connexion au serveur EVJF...",
  "Analyse du profil joueur...",
  "Génération des missions...",
  "Chargement des coéquipières...",
  "Finalisation..."
];

let progress = 0;
let index = 0;

let interval = setInterval(() => {

  progress += 5;

  document.getElementById("progressBar").style.width = progress + "%";
  document.getElementById("progressText").innerText = progress + "%";

  if (progress % 20 === 0 && index < messages.length) {
    document.getElementById("loadingText").innerText = messages[index];
    index++;
  }

  if (progress >= 100) {

    clearInterval(interval);

    document.getElementById("loadingText").style.display = "none";

    const overlay = document.getElementById("errorOverlay");

    overlay.style.display = "flex";

    overlay.innerText =
    "❌ ERREUR ! Date non identifiée ! Merci de réessayer ultérieurement";

    // Apparition bouton après 5 sec
    setTimeout(() => {
      document.getElementById("funButton").style.display = "block";
    }, 5000);

  }

}, 300);

/* =========================
   VIDEOS ALEATOIRES
========================= */

const videos = [

  "https://www.youtube.com/embed/00oJQDwNDyY",
  "https://www.youtube.com/embed/BfW72FjVC6k",
  "https://www.youtube.com/embed/yJfh59iEscg",
  "https://www.youtube.com/embed/Y0pdUyFC7As",
  "https://www.youtube.com/embed/NpqfUI7DDB4",
  "https://www.youtube.com/embed/y0sF5xhGreA",
  "https://www.youtube.com/embed/xFnoap4kcNY",
  "https://www.youtube.com/embed/aZ4NlkFxbhM",
  "https://www.youtube.com/embed/__ON3C3GRis",
  "https://www.youtube.com/embed/uAa4lMf3jSg"

];

document.getElementById("funButton").addEventListener("click", () => {

  const random =
  videos[Math.floor(Math.random() * videos.length)];

  document.getElementById("videoContainer").innerHTML = `

    <iframe
      width="100%"
      height="315"
      src="${random}"
      frameborder="0"
      allowfullscreen>
    </iframe>

  `;
});

</script>

<script src="script.js"></script>

</body>
  <a href="index.html" class="menu-button">
  ⬅ Menu principal
  </a>
</html>
